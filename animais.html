<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d9488">
  <title>Tubapet - Cadastro de animal</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Tubapet</h1>
    <nav>
      <a href="index.html">Cliente</a>
      <a href="animais.html" class="ativo">Animal</a>
      <a href="lista.html">Lista</a>
    </nav>
  </header>
  <main>
    <h2>Novo animal</h2>
    <form id="form-animal">
      <label for="idcliente">Dono (cliente)</label>
      <select id="idcliente" required></select>
      <label for="nome">Nome</label>
      <input type="text" id="nome" placeholder="Thor" required>
      <label for="especie">Espécie</label>
      <input type="text" id="especie" placeholder="Cachorro" required>
      <label for="raca">Raça</label>
      <input type="text" id="raca" placeholder="Labrador" required>
      <label for="idade">Idade (anos)</label>
      <input type="number" id="idade" min="0" step="1" placeholder="3" required>
      <button type="submit">Salvar</button>
    </form>
    <p id="mensagem" role="status"></p>
  </main>
  <script src="js/storage.js"></script>
  <script src="js/animais.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
